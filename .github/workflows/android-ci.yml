name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-build:
    name: Android 37 / map shell
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Install Android API 37 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Test label placement contracts
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug shell
        run: gradle :app:assembleDebug --stacktrace
